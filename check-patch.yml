name: Overwatch patch monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

concurrency:
  group: overwatch-patch-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v5

      - name: Python 설치
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: 한글 폰트 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: Python 라이브러리 설치
        run: pip install -r requirements.txt

      - name: 패치 확인 및 Discord 전송
        id: monitor
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SEND_ON_FIRST_RUN: "true"
          MONTH_LOOKBACK: "4"
          NEXON_MAX_ARTICLES: "20"
          # Defense in depth: monitor.py also hard-locks delivery to newest only.
          LATEST_PATCH_ONLY: "true"
        run: python monitor.py

      - name: state.json 저장
        if: ${{ always() && (steps.monitor.outcome == 'success' || steps.monitor.outcome == 'failure') }}
        run: |
          if [ ! -f state.json ]; then
            echo "저장할 state.json 없음"
            exit 0
          fi

          git add -- state.json
          if git diff --cached --quiet -- state.json; then
            echo "state.json 변경 없음"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update Overwatch patch state"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
