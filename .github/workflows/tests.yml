name: Monitor regression tests

on:
  pull_request:
  push:
    branches: [main, 'codex/**']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Install Korean fonts for card rendering
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python -m unittest discover -s tests -v
      - name: Check Python syntax without sending Discord messages
        run: python -m compileall -q monitor.py balance_context.py patch_revisions.py summary_text.py summary_cards.py test_latest.py scripts tests
      - name: Render offline card samples
        run: python scripts/chat_preview.py
      - uses: actions/upload-artifact@v7
        with:
          name: summary-card-previews
          path: card-previews/
          if-no-files-found: error
          retention-days: 14
